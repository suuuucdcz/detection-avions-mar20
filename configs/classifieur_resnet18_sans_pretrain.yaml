# Comparaison : le même ResNet-18, mais SANS pré-entraînement (poids au hasard).
# Mesure ce qu'apporte le transfer learning (décision D5). Même recette que le classifieur
# principal, sauf pas de gel (il n'y a rien à préserver) et plus d'epochs (il part de zéro).

name: classifieur_resnet18_sans_pretrain
architecture: resnet18
pretrained: false

epochs: 40
freeze_epochs: 0
patience: 8
batch: 64
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
workers: 2
seed: 0
device: auto
