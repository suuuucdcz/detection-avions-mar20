# Classifieur principal : ResNet-18 pré-entraîné sur ImageNet (transfer learning).
# Étage 2 de notre architecture : « quel type d'avion ? » à partir de la vignette.
# Lancer : uv run python scripts/train_classifier.py configs/classifieur_resnet18.yaml

name: classifieur_resnet18
architecture: resnet18
pretrained: true          # poids appris sur ImageNet : le réseau sait déjà « voir »

epochs: 25                # nombre maximal de passages sur les vignettes d'entraînement
freeze_epochs: 3          # 3 premières epochs : seule la nouvelle couche finale apprend
patience: 5               # early stopping si la macro-F1 de validation stagne 5 epochs
batch: 64                 # vignettes traitées ensemble
lr: 0.0003                # taux d'apprentissage : taille des pas de la descente de gradient
weight_decay: 0.0001      # pénalise les poids trop grands (limite l'overfitting)
label_smoothing: 0.1      # évite que le réseau soit sûr à 100 % (limite l'overfitting)
workers: 2                # processus qui chargent les vignettes
seed: 0
device: auto              # GPU s'il y en a un (Colab), sinon processeur
