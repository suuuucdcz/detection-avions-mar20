# Comparaison : petit CNN « maison » (4 blocs de convolution), entraîné de zéro.
# Témoin simple : ses courbes d'apprentissage permettent d'observer l'overfitting.

name: classifieur_smallcnn
architecture: smallcnn
pretrained: false

epochs: 40
freeze_epochs: 0
patience: 8
batch: 64
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
workers: 2
seed: 0
device: auto
