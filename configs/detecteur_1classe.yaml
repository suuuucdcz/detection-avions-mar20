# Détecteur à 1 classe « avion » : étage 1 de notre architecture (« où sont les avions ? »).
# Lancer : uv run python scripts/train_detector.py configs/detecteur_1classe.yaml
# Chaque paramètre est un argument de model.train() d'Ultralytics :
# https://docs.ultralytics.com/modes/train/#train-settings

name: detecteur_1classe   # nom du dossier dans runs/ et du fichier de poids dans models/
model: yolo11n.pt         # YOLO11 « nano » (2,6 M de paramètres) pré-entraîné sur COCO : transfer learning
single_cls: true          # A1…A20 sont fusionnées en une seule classe « avion »

# Entraînement
imgsz: 800                # résolution native des images : on ne les réduit pas (EDA, question 2)
epochs: 80                # nombre maximal de passages sur tout le jeu d'entraînement
patience: 15              # early stopping : arrêt si la validation ne progresse plus pendant 15 epochs
batch: 16                 # images traitées en même temps (à réduire à 8 si la mémoire GPU sature)
workers: 4                # processus qui chargent les images en parallèle (0 si erreur sous Windows)
seed: 0                   # graine fixe : entraînement reproductible

# Data augmentation (EDA, question 3) : vu du ciel, il n'y a ni « haut » ni « bas »
fliplr: 0.5               # retournement gauche-droite, une image sur deux
flipud: 0.5               # retournement haut-bas, une image sur deux
degrees: 0                # pas de rotation quelconque : elle agrandirait les boîtes horizontales
close_mosaic: 10          # les 10 dernières epochs sans « mosaïque » (4 images collées) pour finir sur des images normales
